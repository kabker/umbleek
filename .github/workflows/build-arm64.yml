name: Build Umbleek ARM64 ISO
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    container:
      image: debian:trixie
      options: --privileged
    steps:
      - name: Install tools
        run: apt-get update && apt-get install -y git ca-certificates
      - uses: actions/checkout@v4
      - name: Build ISO
        run: chmod +x build-umbleek-arm64.sh && ./build-umbleek-arm64.sh
      - uses: actions/upload-artifact@v4
        with:
          name: umbleek-arm64-iso
          path: umbleek/*.iso
